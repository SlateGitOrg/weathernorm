[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weathernorm"
version = "0.1.0"
description = "Weather-normalised retrofit savings: per-home degree-day balance points fitted in DuckDB SQL, netted against a comparison group."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "weathernorm contributors" }]
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
weathernorm = "weathernorm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/weathernorm"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "weathernorm/sql"
"config.yaml" = "weathernorm/config.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
